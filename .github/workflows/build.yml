name: Build KalamAI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip wget \
            openjdk-17-jdk \
            python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            ccache \
            lld \
            build-essential

      - name: Set JAVA_HOME
        run: |
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> $GITHUB_ENV
          java -version

      - name: Install Python build tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0
          pip install cython==0.29.37
          pip install kivy==2.3.0

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-py310-${{ hashFiles('app/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-py310-
            buildozer-${{ runner.os }}-

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py310-${{ hashFiles('app/buildozer.spec') }}

      - name: Verify project structure
        run: |
          echo "=== Project Structure ==="
          find . -type f | grep -v ".git" | sort
          echo ""
          echo "=== main.py first 10 lines ==="
          head -10 app/main.py
          echo ""
          echo "=== buildozer.spec requirements line ==="
          grep "requirements" app/buildozer.spec

      - name: Build APK with Buildozer
        working-directory: app
        run: |
          buildozer android debug 2>&1 | tee build.log
          echo "Exit code: $?"
        env:
          BUILDOZER_WARN_ON_ROOT: "0"

      - name: Check build output
        if: always()
        working-directory: app
        run: |
          echo "=== Checking bin/ directory ==="
          ls -la bin/ 2>/dev/null || echo "bin/ directory does not exist"
          echo ""
          echo "=== Last 100 lines of build log ==="
          tail -100 build.log 2>/dev/null || echo "No build log found"

      - name: Upload APK (if exists)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KalamAI-v1.0.0-debug
          path: app/bin/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Upload full build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-full
          path: app/build.log
          retention-days: 14
